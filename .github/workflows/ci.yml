name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic interpreters: runner toolcache Pythons differ per OS (e.g. some cannot load
  # SQLite extensions). The fallback for such Pythons is exercised by the sqlite-probe job.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quality:
    name: Lint, types, architecture, spec traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run python scripts/spec_coverage.py

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Show the SQLite binding in use
        shell: bash
        run: >-
          uv run python -c "import sys, sqlite3; from soundline.adapters.stores.sqlite import
          open_database; print(sys.version, '| stdlib can load extensions:',
          hasattr(sqlite3.Connection, 'enable_load_extension'), '| binding:',
          type(open_database(':memory:')).__module__)"
      - run: uv run pytest -n auto

  sqlite-probe:
    name: SQLite extension probe (${{ matrix.os }}) — ARC-014 spike
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The runner's own Python on purpose: this is what users without uv-managed Pythons get.
      UV_PYTHON_PREFERENCE: system
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Probe (sqlean.py has no Windows wheels)
        shell: bash
        run: >-
          uv run --no-project --python 3.12 --with sqlite-vec
          ${{ runner.os != 'Windows' && '--with sqlean.py' || '' }}
          python -I scripts/probe_sqlite.py
