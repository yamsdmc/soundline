[project]
name = "soundline"
version = "0.0.0"
description = "The eval-first RAG engine. Every answer cited. Every change measured."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "yamsdmc" }]
keywords = ["rag", "retrieval", "llm", "evaluation", "citations", "search"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastembed>=0.7",
    # Fallback SQLite binding for Pythons built without extension loading (ADR 0012).
    # No Windows wheels exist; Windows CPython builds load extensions natively.
    "sqlean-py>=3.47; sys_platform != 'win32'",
    "sqlite-vec>=0.1.6",
    "typer>=0.15",
]

[project.scripts]
soundline = "soundline.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/yamsdmc/soundline"
Documentation = "https://github.com/yamsdmc/soundline/tree/main/docs"
Issues = "https://github.com/yamsdmc/soundline/issues"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.0",
]
openai = [
    "openai>=1.50",
]
mcp = [
    "mcp>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-socket>=0.7",
    "hypothesis>=6.112",
    "ruff>=0.13",
    "pyright>=1.1.405",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundline"]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = [
    "--strict-markers", "--strict-config", "--disable-socket", "--allow-unix-socket", "-ra",
    "-m", "not live and not models",
]
xfail_strict = true
markers = [
    "spec(*ids): behavior IDs from docs/spec covered by this test",
    "slow: takes more than one second",
    "live: calls real external providers (opt-in: -m live --force-enable-socket)",
    "models: downloads and runs real local models (opt-in: -m models --force-enable-socket)",
]

# --- Lint & format -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]  # spec code blocks are hand-formatted documentation

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "C4", "PIE", "PL", "TRY", "PERF"]
ignore = [
    "PLR2004",  # magic values in comparisons: worked examples in tests are intentional
    "TRY003",  # ARC-031 requires errors to carry an actionable message
    "PLR0911",  # exhaustive match statements return once per case
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
"src/soundline/api.py" = ["PLR0913"]  # the composition root takes one dependency per port

# --- Types -------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["scripts/probe_sqlite.py"]  # ARC-014 spike, runs outside the project env (see ADR 0012)
extraPaths = ["scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

# --- Architecture (ARC-001 to ARC-005) ---------------------------------------

[tool.importlinter]
root_package = "soundline"

[[tool.importlinter.contracts]]
name = "ARC-001: the domain depends on no other layer"
type = "forbidden"
source_modules = ["soundline.domain"]
forbidden_modules = ["soundline.application", "soundline.adapters", "soundline.interfaces", "soundline.testing", "soundline.api"]

[[tool.importlinter.contracts]]
name = "ARC-002: the application depends only on the domain"
type = "forbidden"
source_modules = ["soundline.application"]
forbidden_modules = ["soundline.adapters", "soundline.interfaces", "soundline.testing", "soundline.api"]

[[tool.importlinter.contracts]]
name = "ARC-003: adapters do not depend on the application's use cases or on interfaces"
type = "forbidden"
source_modules = ["soundline.adapters"]
forbidden_modules = ["soundline.interfaces"]

[[tool.importlinter.contracts]]
name = "ARC-004: interfaces go through the application, never through driven adapters"
type = "forbidden"
source_modules = ["soundline.interfaces"]
forbidden_modules = ["soundline.adapters"]
# Interfaces may reach adapters only through the facade, which is the composition root
# (ARC-006, see the M1 note in docs/spec/02-architecture.md). Direct imports stay forbidden.
ignore_imports = ["soundline.api -> soundline.adapters.**"]
